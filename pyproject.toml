[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracemeter"
version = "0.1.0"
description = "Local-first, zero-infra cost & latency dashboard for LLM pipelines, built on OpenTelemetry GenAI conventions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Kazu Labs" }]
keywords = ["llm", "observability", "opentelemetry", "cost", "tracing", "genai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
server = ["fastapi>=0.110.0", "uvicorn>=0.27.0"]
otlp = ["opentelemetry-proto>=1.20.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "opentelemetry-proto>=1.20.0",
]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "httpx>=0.27.0", "opentelemetry-proto>=1.20.0"]

[project.urls]
Homepage = "https://github.com/Kazu-Labs/tracemeter"
Issues = "https://github.com/Kazu-Labs/tracemeter/issues"

[project.scripts]
tracemeter = "tracemeter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracemeter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
