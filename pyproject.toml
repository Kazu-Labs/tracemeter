[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracemeter"
version = "0.2.0"
description = "Local-first, zero-infra cost & latency dashboard for LLM pipelines, built on OpenTelemetry GenAI conventions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Kazu Labs" }]
keywords = [
    "llm", "observability", "opentelemetry", "otel", "cost", "cost-tracking",
    "tracing", "genai", "gen-ai", "llmops", "llm-observability", "dashboard",
    "openai", "anthropic", "litellm", "langchain", "llamaindex", "otlp", "ai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Distributed Computing",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
langchain = ["langchain-core>=0.2.0"]
# llama-index-core effectively requires Python 3.10+ as of its newer
# releases (a transitive dependency uses PEP 604 syntax); the marker makes
# this extra a no-op on 3.9 instead of a hard install failure, same
# handling as the `mcp` extra below.
llamaindex = ["llama-index-core>=0.11.0; python_version>='3.10'"]
server = ["fastapi>=0.110.0", "uvicorn>=0.27.0"]
otlp = ["opentelemetry-proto>=1.20.0"]
# mcp>=2.0.0's MCPServer API (the one tracemeter.mcp_server is written
# against) requires Python 3.10+; the marker makes this extra a no-op on
# 3.9 instead of a hard install failure, matching `tracemeter mcp`'s own
# graceful "install the extra" error if it's missing at runtime.
mcp = ["mcp>=2.0.0; python_version>='3.10'"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "langchain-core>=0.2.0",
    "llama-index-core>=0.11.0; python_version>='3.10'",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "opentelemetry-proto>=1.20.0",
    "mcp>=2.0.0; python_version>='3.10'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "langchain-core>=0.2.0",
    "llama-index-core>=0.11.0; python_version>='3.10'",
    "opentelemetry-proto>=1.20.0",
    "mcp>=2.0.0; python_version>='3.10'",
]

[project.urls]
Homepage = "https://github.com/Kazu-Labs/tracemeter"
Repository = "https://github.com/Kazu-Labs/tracemeter"
Issues = "https://github.com/Kazu-Labs/tracemeter/issues"
"Blog post" = "https://kazulabs.com/blog/tracemeter-otel-gap.html"

[project.scripts]
tracemeter = "tracemeter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracemeter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
