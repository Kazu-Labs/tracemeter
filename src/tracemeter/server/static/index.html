<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TraceMeter</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --text-dim: #9aa1ac;
    --accent: #5b9dff;
    --ok: #35c187;
    --err: #ef5a5a;
    --warn: #e8b339;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
  header h1 span { color: var(--accent); }
  .layout { display: grid; grid-template-columns: 380px 1fr; height: calc(100vh - 53px); }
  .sidebar { border-right: 1px solid var(--border); overflow-y: auto; padding: 14px; }
  .main { overflow-y: auto; padding: 14px 20px; }
  .filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .filters input, .filters select {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 9px;
    border-radius: 6px;
    font-size: 13px;
  }
  button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  .trace-row {
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    background: var(--panel);
  }
  .trace-row:hover { border-color: var(--accent); }
  .trace-row.selected { border-color: var(--accent); background: var(--panel-2); }
  .trace-row .name { font-weight: 600; margin-bottom: 4px; }
  .trace-row .meta { color: var(--text-dim); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .trace-row .cost { color: var(--warn); }
  .trace-row .err-badge { color: var(--err); }
  .section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin: 18px 0 8px;
  }
  .empty { color: var(--text-dim); padding: 20px; text-align: center; }
  .waterfall { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
  .wf-row { display: grid; grid-template-columns: 260px 1fr 100px; align-items: center; border-bottom: 1px solid var(--border); padding: 6px 10px; font-size: 12px; }
  .wf-row:last-child { border-bottom: none; }
  .wf-row.error { background: rgba(239, 90, 90, 0.08); }
  .wf-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wf-bar-track { position: relative; height: 16px; background: var(--panel-2); border-radius: 3px; }
  .wf-bar { position: absolute; top: 0; height: 100%; background: var(--accent); border-radius: 3px; min-width: 2px; }
  .wf-bar.error { background: var(--err); }
  .wf-meta { text-align: right; color: var(--text-dim); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  .bar-cell { display: flex; align-items: center; gap: 8px; }
  .bar-track { flex: 1; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  a.export-link { color: var(--accent); text-decoration: none; font-size: 13px; }
  .attrs { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-dim); white-space: pre-wrap; padding: 10px; background: var(--panel-2); border-radius: 6px; margin-top: 4px; max-height: 200px; overflow-y: auto; }
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .stat-tile .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 6px; }
  .stat-tile .value { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .stat-tile .value.err { color: var(--err); }
  .stat-tile .sub { font-size: 11px; color: var(--warn); margin-top: 3px; }
  .unpriced-badge { color: var(--warn); font-size: 11px; font-weight: 500; }
  .wf-row { cursor: pointer; }
  .wf-row:hover { background: var(--panel-2); }
  .wf-attrs { display: none; padding: 0 10px 8px; }
  .wf-attrs.open { display: block; }
  .trace-row .pick { display: flex; align-items: flex-start; gap: 8px; }
  .trace-row .pick input[type=checkbox] { margin-top: 3px; }
  #compare-bar { display: none; align-items: center; justify-content: space-between; background: var(--panel-2); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; font-size: 12px; }
  #compare-bar.active { display: flex; }
  .delta-pos { color: var(--err); }
  .delta-neg { color: var(--ok); }
  .delta-zero { color: var(--text-dim); }
</style>
</head>
<body>
<header>
  <h1>Trace<span>Meter</span></h1>
  <div>
    <a class="export-link" href="/api/export?format=csv" download>Export CSV</a>
    &nbsp;&middot;&nbsp;
    <a class="export-link" href="/api/export?format=json" download>Export JSON</a>
  </div>
</header>
<div class="layout">
  <div class="sidebar">
    <div class="filters">
      <input id="f-name" placeholder="Filter by trace name..." />
      <input id="f-model" placeholder="Filter by model..." />
      <div style="display:flex; gap:8px;">
        <input id="f-start" type="datetime-local" style="flex:1" title="Start after" />
        <input id="f-end" type="datetime-local" style="flex:1" title="Start before" />
      </div>
      <button id="f-refresh">Refresh</button>
    </div>
    <div id="compare-bar">
      <span id="compare-count">0 selected</span>
      <div>
        <button id="compare-go" disabled>Compare</button>
        <button id="compare-clear">Clear</button>
      </div>
    </div>
    <div class="section-title">Traces <span style="color:var(--text-dim); font-weight:normal; text-transform:none;">(check two to compare)</span></div>
    <div id="trace-list"><div class="empty">Loading...</div></div>
  </div>
  <div class="main">
    <div id="stat-row" class="stat-row"></div>
    <div id="detail"><div class="empty">Select a trace to see its waterfall view, or run <code>tracemeter</code> in your app to generate one.</div></div>
    <div class="top-row">
      <div class="section-title" style="margin:0">Cost breakdown</div>
      <div>
        <select id="group-by">
          <option value="model">By model</option>
          <option value="day">By day</option>
          <option value="name">By step</option>
        </select>
      </div>
    </div>
    <div id="cost-summary"></div>
  </div>
</div>

<script>
const $ = (sel) => document.querySelector(sel);
let selectedTraceId = null;
let compareSelection = new Set();
let lastTraces = [];

function fmtMs(ms) {
  if (ms == null) return "-";
  if (ms < 1000) return Math.round(ms) + "ms";
  return (ms / 1000).toFixed(2) + "s";
}
function fmtCost(usd) {
  if (usd == null) return "unknown";
  if (usd === 0) return "$0";
  return "$" + usd.toFixed(usd < 0.01 ? 6 : 4);
}
function fmtTime(unixSeconds) {
  if (unixSeconds == null) return "-";
  return new Date(unixSeconds * 1000).toLocaleString();
}
function fmtCount(n) {
  if (n >= 1000) return (n / 1000).toFixed(1) + "K";
  return String(n);
}

function dateFilterParams() {
  const out = {};
  const startVal = $("#f-start").value;
  const endVal = $("#f-end").value;
  if (startVal) out.start_after = new Date(startVal).getTime() / 1000;
  if (endVal) out.start_before = new Date(endVal).getTime() / 1000;
  return out;
}

function activeFilterParams() {
  const params = new URLSearchParams();
  const name = $("#f-name").value.trim();
  const model = $("#f-model").value.trim();
  if (name) params.set("name", name);
  if (model) params.set("model", model);
  const dates = dateFilterParams();
  if (dates.start_after) params.set("start_after", dates.start_after);
  if (dates.start_before) params.set("start_before", dates.start_before);
  return params;
}

async function loadStats() {
  const res = await fetch("/api/stats?" + activeFilterParams().toString());
  const s = await res.json();
  const row = $("#stat-row");
  if (!s.trace_count) {
    row.innerHTML = "";
    return;
  }
  const costSub = s.unknown_cost_span_count > 0
    ? `<div class="sub">+ ${s.unknown_cost_span_count} unpriced call${s.unknown_cost_span_count === 1 ? "" : "s"}</div>`
    : "";
  row.innerHTML = `
    <div class="stat-tile">
      <div class="label">Total cost${s.unknown_cost_span_count > 0 ? " (known)" : ""}</div>
      <div class="value">${fmtCost(s.total_cost_usd)}</div>
      ${costSub}
    </div>
    <div class="stat-tile">
      <div class="label">Traces</div>
      <div class="value">${fmtCount(s.trace_count)}</div>
    </div>
    <div class="stat-tile">
      <div class="label">Errors</div>
      <div class="value ${s.error_trace_count > 0 ? "err" : ""}">${fmtCount(s.error_trace_count)}</div>
    </div>
    <div class="stat-tile">
      <div class="label">Avg latency</div>
      <div class="value">${fmtMs(s.avg_trace_latency_ms)}</div>
    </div>
  `;
}

async function loadTraces() {
  const params = activeFilterParams();
  const res = await fetch("/api/traces?" + params.toString());
  const traces = await res.json();
  lastTraces = traces;
  const list = $("#trace-list");
  if (!traces.length) {
    list.innerHTML = '<div class="empty">No traces yet.</div>';
    return;
  }
  list.innerHTML = "";
  for (const t of traces) {
    const row = document.createElement("div");
    row.className = "trace-row" + (t.trace_id === selectedTraceId ? " selected" : "");
    const checked = compareSelection.has(t.trace_id) ? "checked" : "";
    row.innerHTML = `
      <div class="pick">
        <input type="checkbox" data-trace-id="${t.trace_id}" ${checked} />
        <div style="flex:1">
          <div class="name">${escapeHtml(t.name)}</div>
          <div class="meta">
            <span>${fmtTime(t.start_time)}</span>
            <span>${fmtMs((t.end_time - t.start_time) * 1000)}</span>
            <span>${t.span_count} spans</span>
            <span class="cost">${fmtCost(t.total_cost_usd)}</span>
            ${t.has_unknown_cost ? `<span class="unpriced-badge">+ unpriced</span>` : ""}
            ${t.error_count > 0 ? `<span class="err-badge">${t.error_count} error(s)</span>` : ""}
          </div>
        </div>
      </div>`;
    row.querySelector(".name").onclick = () => selectTrace(t.trace_id);
    row.querySelector("input[type=checkbox]").addEventListener("click", (e) => e.stopPropagation());
    row.querySelector("input[type=checkbox]").addEventListener("change", (e) => {
      toggleCompareSelection(t.trace_id, e.target.checked);
    });
    list.appendChild(row);
  }
}

function toggleCompareSelection(traceId, isChecked) {
  if (isChecked) {
    if (compareSelection.size >= 2) {
      // Replace the oldest selection so it's always "the last two picked".
      const [first] = compareSelection;
      compareSelection.delete(first);
    }
    compareSelection.add(traceId);
  } else {
    compareSelection.delete(traceId);
  }
  const bar = $("#compare-bar");
  const count = compareSelection.size;
  $("#compare-count").textContent = `${count} selected`;
  $("#compare-go").disabled = count !== 2;
  bar.classList.toggle("active", count > 0);
  loadTraces();
}

$("#compare-clear").onclick = () => {
  compareSelection.clear();
  loadTraces();
  $("#compare-bar").classList.remove("active");
};

$("#compare-go").onclick = () => {
  const [a, b] = compareSelection;
  loadComparison(a, b);
};

async function loadComparison(traceA, traceB) {
  const res = await fetch(`/api/compare?trace_a=${traceA}&trace_b=${traceB}`);
  if (!res.ok) return;
  const data = await res.json();
  renderComparison(data);
}

function deltaClass(delta) {
  if (Math.abs(delta) < 1e-9) return "delta-zero";
  return delta > 0 ? "delta-pos" : "delta-neg";
}
function fmtDelta(delta, fmt) {
  const sign = delta > 0 ? "+" : "";
  return `${sign}${fmt(delta)}`;
}

function renderComparison(data) {
  const nameFor = (id) => (lastTraces.find((t) => t.trace_id === id) || {}).name || id.slice(0, 8);
  const rows = data.steps
    .map(
      (s) => `
    <tr>
      <td>${escapeHtml(s.name)}${s.only_in ? ` <span style="color:var(--text-dim)">(only in ${s.only_in})</span>` : ""}</td>
      <td>${fmtCost(s.a_cost_usd)}</td>
      <td>${fmtCost(s.b_cost_usd)}</td>
      <td class="${deltaClass(s.cost_delta_usd)}">${fmtDelta(s.cost_delta_usd, fmtCost)}</td>
      <td>${fmtMs(s.a_latency_ms)}</td>
      <td>${fmtMs(s.b_latency_ms)}</td>
      <td class="${deltaClass(s.latency_delta_ms)}">${fmtDelta(s.latency_delta_ms, fmtMs)}</td>
    </tr>`
    )
    .join("");

  $("#detail").innerHTML = `
    <div class="top-row">
      <strong>Comparing:</strong>&nbsp;${escapeHtml(nameFor(data.a.trace_id))} (A) vs ${escapeHtml(nameFor(data.b.trace_id))} (B)
    </div>
    <table style="margin-bottom:20px">
      <thead><tr><th>Step</th><th>A cost</th><th>B cost</th><th>Δ cost</th><th>A latency</th><th>B latency</th><th>Δ latency</th></tr></thead>
      <tbody>
        ${rows}
        <tr style="font-weight:600">
          <td>Total</td>
          <td>${fmtCost(data.a.cost_usd)}</td>
          <td>${fmtCost(data.b.cost_usd)}</td>
          <td class="${deltaClass(data.delta.cost_usd)}">${fmtDelta(data.delta.cost_usd, fmtCost)}</td>
          <td>${fmtMs(data.a.latency_ms)}</td>
          <td>${fmtMs(data.b.latency_ms)}</td>
          <td class="${deltaClass(data.delta.latency_ms)}">${fmtDelta(data.delta.latency_ms, fmtMs)}</td>
        </tr>
      </tbody>
    </table>
  `;
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s ?? "";
  return div.innerHTML;
}

async function selectTrace(traceId) {
  selectedTraceId = traceId;
  loadTraces();
  const res = await fetch(`/api/traces/${traceId}`);
  const data = await res.json();
  renderWaterfall(data.spans);
}

function renderWaterfall(spans) {
  const detail = $("#detail");
  if (!spans.length) {
    detail.innerHTML = '<div class="empty">No spans.</div>';
    return;
  }
  const minStart = Math.min(...spans.map((s) => s.start_time));
  const maxEnd = Math.max(...spans.map((s) => s.end_time ?? s.start_time));
  const totalMs = Math.max((maxEnd - minStart) * 1000, 1);

  const rows = spans
    .map((s, i) => {
      const offsetMs = (s.start_time - minStart) * 1000;
      const durMs = ((s.end_time ?? s.start_time) - s.start_time) * 1000;
      const leftPct = (offsetMs / totalMs) * 100;
      const widthPct = Math.max((durMs / totalMs) * 100, 0.3);
      const depth = s.parent_span_id ? 1 : 0;
      const isErr = s.status === "error";
      const cost = s.attributes["tracemeter.cost.usd"];
      const costUnknown = s.attributes["tracemeter.cost.unknown"];
      const model = s.attributes["gen_ai.request.model"] || s.attributes["gen_ai.response.model"];
      let costLabel = "";
      if (cost != null) costLabel = " &middot; " + fmtCost(cost);
      else if (costUnknown) costLabel = ' &middot; <span class="unpriced-badge">unpriced</span>';
      const attrsJson = JSON.stringify(
        { name: s.name, status: s.status, error_message: s.error_message, ...s.attributes },
        null,
        2
      );
      return `
        <div class="wf-row ${isErr ? "error" : ""}" data-row-index="${i}">
          <div class="wf-name" style="padding-left:${depth * 16}px" title="${escapeHtml(s.name)}">
            ${escapeHtml(s.name)}${model ? ` <span style="color:var(--text-dim)">(${escapeHtml(model)})</span>` : ""}
          </div>
          <div class="wf-bar-track">
            <div class="wf-bar ${isErr ? "error" : ""}" style="left:${leftPct}%;width:${widthPct}%"></div>
          </div>
          <div class="wf-meta">${fmtMs(durMs)}${costLabel}</div>
        </div>
        <div class="wf-attrs" data-attrs-index="${i}"><pre class="attrs" style="margin:0">${escapeHtml(attrsJson)}</pre></div>`;
    })
    .join("");

  const totalCost = spans.reduce((acc, s) => acc + (s.attributes["tracemeter.cost.usd"] || 0), 0);
  const unpricedCount = spans.filter((s) => s.attributes["tracemeter.cost.unknown"]).length;

  detail.innerHTML = `
    <div class="top-row">
      <div><strong>${spans.length}</strong> spans &middot; total ${fmtMs(totalMs)} &middot; ${fmtCost(totalCost)}${unpricedCount > 0 ? ` <span class="unpriced-badge">+ ${unpricedCount} unpriced</span>` : ""}</div>
      <div style="color:var(--text-dim); font-size:12px">Click a row for full attributes</div>
    </div>
    <div class="waterfall" id="waterfall">${rows}</div>
  `;

  $("#waterfall").addEventListener("click", (e) => {
    const row = e.target.closest(".wf-row");
    if (!row) return;
    const attrs = $(`.wf-attrs[data-attrs-index="${row.dataset.rowIndex}"]`);
    if (attrs) attrs.classList.toggle("open");
  });
}

async function loadCostSummary() {
  const groupBy = $("#group-by").value;
  const params = activeFilterParams();
  params.set("group_by", groupBy);
  params.delete("name");
  params.delete("model");
  const res = await fetch("/api/cost_summary?" + params.toString());
  const rows = await res.json();
  const el = $("#cost-summary");
  if (!rows.length) {
    el.innerHTML = '<div class="empty">No cost data yet.</div>';
    return;
  }
  const colLabel = { model: "Model", day: "Day", name: "Step" }[groupBy];
  const maxCost = Math.max(...rows.map((r) => r.cost_usd), 0.0001);
  el.innerHTML = `
    <table>
      <thead><tr><th>${colLabel}</th><th>Calls</th><th>Avg latency</th><th style="width:40%">Cost</th></tr></thead>
      <tbody>
        ${rows
          .map(
            (r) => `
          <tr>
            <td>${escapeHtml(r.key)}</td>
            <td>${r.call_count}</td>
            <td>${fmtMs(r.avg_latency_ms)}</td>
            <td>
              <div class="bar-cell">
                <div class="bar-track"><div class="bar-fill" style="width:${(r.cost_usd / maxCost) * 100}%"></div></div>
                <div>${fmtCost(r.cost_usd)}${r.unknown_cost_count > 0 ? ` <span class="unpriced-badge">+${r.unknown_cost_count} unpriced</span>` : ""}</div>
              </div>
            </td>
          </tr>`
          )
          .join("")}
      </tbody>
    </table>
  `;
}

function refreshAll() { loadStats(); loadTraces(); loadCostSummary(); }

$("#f-refresh").onclick = refreshAll;
$("#f-name").addEventListener("keydown", (e) => { if (e.key === "Enter") refreshAll(); });
$("#f-model").addEventListener("keydown", (e) => { if (e.key === "Enter") refreshAll(); });
$("#group-by").addEventListener("change", loadCostSummary);

refreshAll();
setInterval(refreshAll, 5000);
</script>
</body>
</html>
